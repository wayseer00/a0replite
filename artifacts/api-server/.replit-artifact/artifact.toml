kind = "api"
  previewPath = "/api"
  title = "API Server"
  version = "1.0.0"
  id = "3B4_FFSkEVBkAeYMFRJ2e"

  [[services]]
  localPort = 8080
  name = "API Server"
  paths = ["/api", "/health"]

  [services.development]
  run = "PYTHONPATH=/home/runner/workspace:/home/runner/workspace/backend uvicorn backend.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /home/runner/workspace/backend"

  [services.development.env]
  PYTHONPATH = "/home/runner/workspace:/home/runner/workspace/backend"

  [services.production]

  [services.production.build]
  args = ["echo", "no-build"]

  [services.production.build.env]
  PYTHONPATH = "/home/runner/workspace:/home/runner/workspace/backend"

  [services.production.run]
  args = ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8080"]

  [services.production.run.env]
  PORT = "8080"
  PYTHONPATH = "/home/runner/workspace:/home/runner/workspace/backend"

  [services.production.health.startup]
  path = "/health"
  